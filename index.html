  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ight: 700;\n  font-display: swap;\n  src: url(\"06de7a4d-ba92-474a-b71c-d99816a97e7b\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Spline Sans Mono';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"4c736e5f-00b5-43ab-9f40-6d5d2915218b\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\nbody{margin:0;background:#e9dcc0;font-variant-numeric:tabular-nums;}\na{color:#b07f1f} a:hover{color:#2f261a}\ninput[type=range]{accent-color:#b07f1f;}\n::selection{background:#c23a2e;color:#e9dcc0;}\n@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"font-family:'Spline Sans Mono',monospace; background:#e9dcc0; color:#3a3022; position:relative;\">\n  <sc-if value=\"{{ scanlines }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"position:fixed; inset:0; pointer-events:none; z-index:40; background:repeating-linear-gradient(0deg, rgba(60,40,10,0.06) 0px, rgba(60,40,10,0.06) 1px, transparent 1px, transparent 3px);\"><\u002Fdiv>\n    <div style=\"position:fixed; inset:0; pointer-events:none; z-index:41; background:radial-gradient(ellipse 120% 90% at 50% 40%, transparent 60%, rgba(85,55,15,0.16) 100%);\"><\u002Fdiv>\n  <\u002Fsc-if>\n\n  <div style=\"position:sticky; top:0; z-index:30; background:rgba(233,220,192,0.96); border-bottom:1px solid #c9b78d; display:flex; align-items:center; gap:20px; padding:10px 28px; flex-wrap:wrap;\">\n    <div style=\"display:flex; gap:7px; align-items:center;\">\n      <div style=\"width:11px; height:11px; border-radius:50%; background:#c23a2e;\"><\u002Fdiv>\n      <div style=\"width:11px; height:11px; border-radius:50%; background:#c23a2e;\"><\u002Fdiv>\n      <div style=\"width:11px; height:11px; border-radius:50%; background:#b07f1f;\"><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"font-size:14px; font-weight:600; color:#3a3022; cursor:pointer;\" sc-camel-on-click=\"{{ goTop }}\">aleks@studiolo:<span style=\"color:#b07f1f;\">~/the-meter<\u002Fspan>$<\u002Fdiv>\n    <div style=\"display:flex; gap:18px; flex-wrap:wrap; font-size:13px; font-weight:500; letter-spacing:0.5px;\">\n      <div style=\"color:#4a3c28; cursor:pointer;\" style-hover=\"color:#b07f1f;\" sc-camel-on-click=\"{{ go1 }}\">01_month.log<\u002Fdiv>\n      <div style=\"color:#4a3c28; cursor:pointer;\" style-hover=\"color:#b07f1f;\" sc-camel-on-click=\"{{ go2 }}\">02_machines<\u002Fdiv>\n      <div style=\"color:#4a3c28; cursor:pointer;\" style-hover=\"color:#b07f1f;\" sc-camel-on-click=\"{{ go3 }}\">03_bill.sh<\u002Fdiv>\n      <div style=\"color:#4a3c28; cursor:pointer;\" style-hover=\"color:#b07f1f;\" sc-camel-on-click=\"{{ go4 }}\">04_quality.diff<\u002Fdiv>\n      <div style=\"color:#4a3c28; cursor:pointer;\" style-hover=\"color:#b07f1f;\" sc-camel-on-click=\"{{ go5 }}\">05_fair_fight<\u002Fdiv>\n      <div style=\"color:#4a3c28; cursor:pointer;\" style-hover=\"color:#b07f1f;\" sc-camel-on-click=\"{{ go6 }}\">06_five_years<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"margin-left:auto; position:relative;\">\n      <button sc-camel-on-click=\"{{ toggleMeth }}\" style=\"background:{{ methBg }}; color:{{ methFg }}; border:1px solid #8a6a3e; font-family:'Spline Sans Mono',monospace; font-size:12.5px; font-weight:600; letter-spacing:1px; padding:7px 14px; cursor:pointer;\" style-hover=\"background:#b07f1f; color:#e9dcc0; border-color:#b07f1f;\">METHODOLOGY {{ methArrow }}<\u002Fbutton>\n      <sc-if value=\"{{ methOpen }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"position:absolute; top:40px; right:0; width:min(560px, 86vw); background:#e2d3ae; border:1px solid #8a6a3e; box-shadow:0 18px 50px rgba(60,40,10,0.25); padding:22px 24px; z-index:50; max-height:70vh; overflow:auto;\">\n          <div style=\"font-size:12px; font-weight:600; letter-spacing:2px; color:#b07f1f;\">$ cat METHODOLOGY.md<\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; gap:14px; margin-top:16px; font-size:12.5px; line-height:1.65; color:#3a3022;\">\n            <div><span style=\"color:#2f261a; font-weight:600;\">demand.<\u002Fspan> measured from the author’s own transcripts, jul 29 – aug 28 2026: 39.6M output · 513M new prefill (uncached input + cache writes) · 14.14B cache reads · 71,350 requests, deduplicated by message + request id.<\u002Fdiv>\n            <div><span style=\"color:#2f261a; font-weight:600;\">the $14,914.<\u002Fspan> the same token flow priced at anthropic list word-rates, every cache tier counted at its own price. the plan sold the month for $200 — 74.6× below its own meter.<\u002Fdiv>\n            <div><span style=\"color:#2f261a; font-weight:600;\">desk feasibility.<\u002Fspan> hours = (new prefill + 10% of cache reads) ÷ measured prefill speed + output ÷ decode speed. the 10% is kv-cache eviction a local server must recompute (scenarios run 5–25%); local caching is otherwise credited in full. a month holds 720 h.<\u002Fdiv>\n            <div><span style=\"color:#2f261a; font-weight:600;\">desk cost.<\u002Fspan> hardware amortized over 36 months net of resale (base residuals 40–70%, shortage-inflated) · capital at 5%/yr · power at measured idle/load watts × us-avg $0.183/kWh · upkeep 13.7 h/mo (setup share, maintenance and light interventions) at a chosen wage, $75/h base.<\u002Fdiv>\n            <div><span style=\"color:#2f261a; font-weight:600;\">quality.<\u002Fspan> artificial analysis intelligence index, same harness for all models. 4-bit quantization costs ~4 points on every model measured. redo tax from a june 2026 paired study: 74 vs 114 tests passed (65%), 7× interventions. retry-adjusted hours = raw hours ÷ acceptance, with acceptance scaled from that 65% anchor by each model’s quality index (q÷56 × 65%).<\u002Fdiv>\n            <div><span style=\"color:#2f261a; font-weight:600;\">fair fight.<\u002Fspan> the same token flow re-billed at posted open-model rates, checked aug 31–sep 1 2026: deepseek first-party off-peak with prefix-cache hits at 1–3% of list. routed hosts (openrouter): caching is pass-through and provider-dependent — reads at 0.25–0.5× input where supported, held by sticky routing, but measured tests show some hosts cache nothing; the $300–540 and $1,037 rows bracket those two worlds.<\u002Fdiv>\n            <div style=\"color:#6b5b44; font-size:11.5px; border-top:1px solid #c9b78d; padding-top:12px;\">full workings, scripts and sources: <a href=\"https://github.com/SvetimFM/costCalcAI\" style=\"color:#b07f1f;\">github.com/SvetimFM/costCalcAI<\u002Fa> · models/cost_model.py · models/tco_model.py<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div data-screen-label=\"Hero\" style=\"position:relative; overflow:hidden;\">\n    <canvas data-organism=\"\" style=\"position:absolute; inset:0; width:100%; height:100%; opacity:0.22;\"><\u002Fcanvas>\n    <div style=\"position:absolute; inset:0; background:linear-gradient(90deg, rgba(233,220,192,0.94) 0%, rgba(233,220,192,0.82) 46%, rgba(233,220,192,0.35) 75%, rgba(233,220,192,0.12) 100%);\"><\u002Fdiv>\n    <div style=\"position:relative; max-width:1060px; margin:0 auto; padding:120px 40px 100px;\">\n      <div style=\"font-size:13px; color:#6b5b44;\">$ claude-meter --month 2026-08 --source ~/.claude/transcripts<\u002Fdiv>\n      <div style=\"font-size:12px; color:#8f7f5f; margin-top:6px;\">parsing 71,350 requests ... done in 4.2s<\u002Fdiv>\n      <div style=\"font-size:42px; font-weight:400; line-height:1.3; color:#2f261a; margin-top:44px; max-width:820px;\">What one month of AI-assisted coding actually costs<span style=\"display:inline-block; width:13px; height:32px; background:#b07f1f; margin-left:10px; vertical-align:-3px; animation:blink 1.1s step-end infinite;\"><\u002Fspan><\u002Fdiv>\n      <div style=\"font-size:20px; color:#6b5f49; line-height:1.45; margin-top:14px; max-width:700px;\">Measuring the “local models are free” claim against 14.69 billion tokens of my own usage<\u002Fdiv>\n      <div style=\"font-size:16px; color:#3a3022; line-height:1.7; margin-top:28px; max-width:660px;\">I parsed my own Claude Code transcripts for the 30 days ending August 28, 2026: 14.69 billion tokens across 71,350 requests, which would have cost $14,914 at API list rates but ran on a $200/mo subscription. This page asks whether buying hardware and running open models at home would have been cheaper. Short answer: no — once you count depreciation, power, tied-up capital, and the 13.7 hours a month of setup and upkeep, the hardware is a rounding error and <span style=\"color:#c23a2e;\">your own time is 90% of the bill<\u002Fspan>. The sections below walk through the workload, which machines could physically keep up, what each really costs per month, the quality gap, what renting the same open models costs instead, and the five-year picture.<\u002Fdiv>\n      <div style=\"display:flex; gap:0; margin-top:52px; border:1px solid #c9b78d; background:rgba(233,220,192,0.72); flex-wrap:wrap;\">\n        <div style=\"padding:20px 30px;\"><div style=\"font-size:26px; font-weight:600; color:#b07f1f;\">14.69B<\u002Fdiv><div style=\"font-size:11px; color:#6b5b44; letter-spacing:1.5px; margin-top:4px;\">TOKENS METERED<\u002Fdiv><\u002Fdiv>\n        <div style=\"padding:20px 30px; border-left:1px solid #c9b78d;\"><div style=\"font-size:26px; font-weight:600; color:#b07f1f;\">71,350<\u002Fdiv><div style=\"font-size:11px; color:#6b5b44; letter-spacing:1.5px; margin-top:4px;\">REQUESTS<\u002Fdiv><\u002Fdiv>\n        <div style=\"padding:20px 30px; border-left:1px solid #c9b78d;\"><div style=\"font-size:26px; font-weight:600; color:#2f261a;\">$200 <span style=\"color:#8f7f5f;\">/<\u002Fspan> <span style=\"color:#c23a2e;\">$14,914<\u002Fspan><\u002Fdiv><div style=\"font-size:11px; color:#6b5b44; letter-spacing:1.5px; margin-top:4px;\">PAID / METERED VALUE<\u002Fdiv><\u002Fdiv>\n        <div style=\"padding:20px 30px; border-left:1px solid #c9b78d;\"><div style=\"font-size:26px; font-weight:600; color:#2f261a;\">×74.6<\u002Fdiv><div style=\"font-size:11px; color:#6b5b44; letter-spacing:1.5px; margin-top:4px;\">SUBSCRIPTION LEVERAGE<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-size:11.5px; color:#8f7f5f; margin-top:14px;\">background: 2,600 agents re-tracing the month’s request graph · move the mouse to disturb them<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div data-screen-label=\"01 The month\" style=\"border-top:1px solid #c9b78d;\">\n  <div style=\"max-width:1060px; margin:0 auto; padding:84px 40px;\">\n    <div style=\"font-size:13px; color:#6b5b44;\">$ cat <span style=\"color:#b07f1f;\">01_month.log<\u002Fspan> <span style=\"color:#8f7f5f;\"># what actually passed between us<\u002Fspan><\u002Fdiv>\n    <div style=\"font-size:38px; font-weight:700; color:#2f261a; margin-top:16px; letter-spacing:-1px;\">Most of the traffic is the machine re-reading its own context.<\u002Fdiv>\n    <div style=\"font-size:15.5px; color:#3a3022; margin-top:12px; max-width:640px; line-height:1.6;\">Here is the month as one continuous line, 1 pixel per 100,000 tokens (about 39 metres at full scale). 96.3% of all tokens were cache reads: previous conversation re-fed to the model on every request so it keeps its context. My actual typing — about 1 million tokens — is the dot at the start.<\u002Fdiv>\n    <div style=\"border:1px solid #c9b78d; background:#e2d3ae; padding:26px; margin-top:32px;\">\n      <svg sc-camel-view-box=\"0 0 1240 810\" style=\"width:100%; display:block;\">\n        <circle cx=\"20\" cy=\"34\" r=\"7\" fill=\"none\" stroke=\"#2f261a\" stroke-width=\"1.2\"><\u002Fcircle>\n        <line x1=\"30\" y1=\"28\" x2=\"58\" y2=\"16\" stroke=\"#8f7f5f\" stroke-width=\"1\"><\u002Fline>\n        <text x=\"64\" y=\"18\" font-size=\"11.5\" fill=\"#3a3022\" font-family=\"Spline Sans Mono\">typed by the human, all month: 1,043,000 tokens<\u002Ftext>\n        <sc-for list=\"{{ meander }}\" as=\"m\" hint-placeholder-count=\"4\">\n          <path d=\"{{ m.d }}\" fill=\"none\" stroke=\"{{ m.c }}\" stroke-width=\"2.4\" stroke-linejoin=\"round\" stroke-linecap=\"round\" opacity=\"{{ m.o }}\"><\u002Fpath>\n        <\u002Fsc-for>\n      <\u002Fsvg>\n      <div style=\"display:flex; gap:26px; margin-top:18px; font-size:11.5px; color:#6b5b44; flex-wrap:wrap;\">\n        <div><span style=\"display:inline-block; width:10px; height:10px; background:#2f261a; margin-right:7px;\"><\u002Fspan>human input · 1.04M<\u002Fdiv>\n        <div><span style=\"display:inline-block; width:10px; height:10px; background:#b07f1f; margin-right:7px;\"><\u002Fspan>written by the machine · 39.6M<\u002Fdiv>\n        <div><span style=\"display:inline-block; width:10px; height:10px; background:#c23a2e; margin-right:7px;\"><\u002Fspan>new context · 512M<\u002Fdiv>\n        <div><span style=\"display:inline-block; width:10px; height:10px; background:#c8b389; margin-right:7px;\"><\u002Fspan>memory re-read · 14.14B · 96.3%<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex; gap:52px; margin-top:40px; flex-wrap:wrap;\">\n      <div><div style=\"font-size:21px; font-weight:600; color:#b07f1f;\">5,700/s<\u002Fdiv><div style=\"font-size:12.5px; color:#6b5b44; margin-top:4px;\">token demand, around the clock<\u002Fdiv><\u002Fdiv>\n      <div><div style=\"font-size:21px; font-weight:600; color:#b07f1f;\">1 : 370<\u002Fdiv><div style=\"font-size:12.5px; color:#6b5b44; margin-top:4px;\">written to re-read, behind every million<\u002Fdiv><\u002Fdiv>\n      <div><div style=\"font-size:21px; font-weight:600; color:#b07f1f;\">90% off<\u002Fdiv><div style=\"font-size:12.5px; color:#6b5b44; margin-top:4px;\">the provider’s cached re-read price; a desk recomputes evictions<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div data-screen-label=\"02 Machines\" style=\"border-top:1px solid #c9b78d;\">\n  <div style=\"max-width:1060px; margin:0 auto; padding:84px 40px;\">\n    <div style=\"font-size:13px; color:#6b5b44;\">$ ls <span style=\"color:#b07f1f;\">/dev/desks<\u002Fspan> --time-to-serve <span style=\"color:#8f7f5f;\"># days of nonstop compute for the measured month<\u002Fspan><\u002Fdiv>\n    <div style=\"font-size:38px; font-weight:700; color:#2f261a; margin-top:16px; letter-spacing:-1px;\">Which machines could physically keep up?<\u002Fdiv>\n    <div style=\"font-size:15.5px; color:#3a3022; margin-top:12px; max-width:640px; line-height:1.6;\">Six realistic home setups, each running 24/7 with local caching credited. Note that speed here is not capability — the fast rows are fast because they run the smallest models, and smaller models get more of their work rejected at review. The hatched red bar prices that in: hours re-run at each model’s estimated acceptance rate.<\u002Fdiv>\n    <div style=\"position:relative; margin-top:44px;\">\n      <div style=\"position:absolute; left:50%; top:-6px; bottom:-6px; width:1px; background:#b07f1f; opacity:0.55;\"><\u002Fdiv>\n      <div style=\"position:absolute; left:50%; top:-26px; transform:translateX(-50%); font-size:11.5px; color:#b07f1f; white-space:nowrap;\">30 DAYS — THE MONTH ENDS<\u002Fdiv>\n      <div style=\"display:flex; flex-direction:column; gap:14px;\">\n        <sc-for list=\"{{ pace }}\" as=\"p\" hint-placeholder-count=\"6\">\n          <div style=\"display:grid; grid-template-columns:250px 1fr 170px; gap:16px; align-items:center;\">\n            <div style=\"text-align:right;\"><div style=\"font-size:13.5px; font-weight:600; color:#2f261a;\">{{ p.name }}<\u002Fdiv><div style=\"font-size:11.5px; color:#6b5b44;\">{{ p.sub }}<\u002Fdiv><\u002Fdiv>\n            <div style=\"display:flex; flex-direction:column; gap:3px;\"><div style=\"height:12px; background:#d7c69e;\"><div style=\"height:12px; width:{{ p.pct }}%; background:{{ p.color }};\"><\u002Fdiv><\u002Fdiv><div style=\"height:7px; background:#d7c69e;\"><div style=\"height:7px; width:{{ p.pct2 }}%; background:repeating-linear-gradient(45deg, #c23a2e 0 4px, transparent 4px 8px);\"><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n            <div style=\"font-size:12.5px; color:{{ p.vcolor }};\">{{ p.verdict }}<div style=\"font-size:11px; color:#c23a2e;\">{{ p.verdict2 }}<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"font-size:13.5px; color:#3a3022; margin-top:30px;\">Three of the six can’t finish the month’s work inside a month — and once rejected work is redone, <span style=\"color:#c23a2e;\">four of six fail<\u002Fspan>. Only the two GPU rigs still finish, and up to half their time is redone work. The best local model lives in the slowest box.<\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div data-screen-label=\"03 Bill\" style=\"border-top:1px solid #c9b78d;\">\n  <div style=\"max-width:1060px; margin:0 auto; padding:84px 40px;\">\n    <div style=\"font-size:13px; color:#6b5b44;\">$ sh <span style=\"color:#b07f1f;\">03_bill.sh<\u002Fspan> --wage <span style=\"color:#c23a2e;\">{{ wageLabel }}<\u002Fspan> <span style=\"color:#8f7f5f;\"># cost per million tokens written, honestly accounted<\u002Fspan><\u002Fdiv>\n    <div style=\"font-size:38px; font-weight:700; color:#2f261a; margin-top:16px; letter-spacing:-1px;\">Hardware is cheap. The 13.7 hours a month of upkeep is not.<\u002Fdiv>\n    <div style=\"font-size:15.5px; color:#3a3022; margin-top:12px; max-width:640px; line-height:1.6;\">Each bar is cost per million output tokens: depreciation net of resale, power, and capital, plus 13.7 hours a month of setup and maintenance priced at an hourly rate you pick. Drag the slider to see how the comparison depends almost entirely on what your time is worth.<\u002Fdiv>\n    <div style=\"border:1px solid #c9b78d; background:#e2d3ae; padding:20px 24px; margin-top:34px; display:flex; align-items:center; gap:24px; flex-wrap:wrap;\">\n      <div style=\"font-size:12px; color:#3a3022; white-space:nowrap;\">YOUR TIME · 13.7 h/mo<\u002Fdiv>\n      <input type=\"range\" min=\"0\" max=\"40\" step=\"0.5\" value=\"{{ wage }}\" sc-camel-on-change=\"{{ setWage }}\" style=\"flex:1; min-width:200px;\">\n      <div style=\"font-size:19px; font-weight:600; min-width:80px; text-align:right; color:#c23a2e;\">{{ wageLabel }}<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"font-size:13.5px; margin-top:14px; color:{{ verdictColor }};\">&gt; {{ verdictLine }}<\u002Fdiv>\n    <div style=\"position:relative; margin-top:36px;\">\n      <div style=\"position:absolute; left:calc((100% - 412px)*0.2525 + 266px); top:-6px; bottom:-6px; width:1px; background:#b07f1f; opacity:0.7;\"><\u002Fdiv>\n      <div style=\"position:absolute; left:calc((100% - 412px)*0.2525 + 266px); top:-26px; transform:translateX(-50%); font-size:11.5px; color:#b07f1f; white-space:nowrap;\">THE PLAN · $5.05/M<\u002Fdiv>\n      <div style=\"display:flex; flex-direction:column; gap:14px;\">\n        <div style=\"display:grid; grid-template-columns:250px 1fr 130px; gap:16px; align-items:center;\">\n          <div style=\"text-align:right;\"><div style=\"font-size:13.5px; font-weight:600; color:#2f261a;\">CLAUDE MAX 20×<\u002Fdiv><div style=\"font-size:11.5px; color:#6b5b44;\">$200/mo flat · opus 5 · q63 · no upkeep<\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex; height:16px; background:#d7c69e;\"><div style=\"width:25.25%; background:#b07f1f;\"><\u002Fdiv><\u002Fdiv>\n          <div style=\"text-align:right;\"><div style=\"font-size:15px; font-weight:600; color:#b07f1f;\">1.00×<\u002Fdiv><div style=\"font-size:11.5px; color:#6b5b44;\">$5.05/M · flat at any wage<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <sc-for list=\"{{ rows }}\" as=\"r\" hint-placeholder-count=\"6\">\n          <div style=\"display:grid; grid-template-columns:250px 1fr 130px; gap:16px; align-items:center;\">\n            <div style=\"text-align:right;\"><div style=\"font-size:13.5px; font-weight:600; color:#2f261a;\">{{ r.name }}<\u002Fdiv><div style=\"font-size:11.5px; color:#6b5b44;\">{{ r.sub }}<\u002Fdiv><\u002Fdiv>\n            <div style=\"display:flex; height:16px; background:#d7c69e;\">\n              <div style=\"width:{{ r.hwPct }}%; background:#b3874f;\"><\u002Fdiv>\n              <div style=\"width:{{ r.laborPct }}%; background:#c23a2e;\"><\u002Fdiv>\n              <sc-if value=\"{{ r.clipped }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"display:flex; align-items:center; padding-left:8px; font-size:11.5px; color:#c23a2e;\">→<\u002Fdiv><\u002Fsc-if>\n            <\u002Fdiv>\n            <div style=\"text-align:right;\"><div style=\"font-size:15px; font-weight:600; color:{{ r.ratioColor }};\">{{ r.ratio }}<\u002Fdiv><div style=\"font-size:11.5px; color:#6b5b44;\">{{ r.cost }}<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex; gap:22px; margin-top:24px; font-size:11.5px; color:#6b5b44; flex-wrap:wrap;\">\n      <div><span style=\"display:inline-block; width:10px; height:10px; background:#b3874f; margin-right:6px;\"><\u002Fspan>hardware: owning + power + capital<\u002Fdiv>\n      <div><span style=\"display:inline-block; width:10px; height:10px; background:#c23a2e; margin-right:6px;\"><\u002Fspan>your hours, at the wage above<\u002Fdiv>\n      <div>ratio = multiple of the plan · scale to $20/M<\u002Fdiv>\n      <div style=\"width:100%; color:#8f7f5f;\">⚠ rows marked with a warning can’t finish the month in 720 h — the same 13.7 h of upkeep spreads over less completed work, so their time cost per million rises faster as the wage climbs<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"border-top:1px solid #c9b78d; margin-top:30px; padding-top:16px; font-size:12.5px; color:#3a3022; line-height:1.9;\">where each desk falls past the plan — mac 256 at <span style=\"color:#2f261a;\">$0.52/h<\u002Fspan> · strix <span style=\"color:#2f261a;\">$1.68<\u002Fspan> · 5090 <span style=\"color:#2f261a;\">$5.26<\u002Fspan> · dgx <span style=\"color:#2f261a;\">$5.61<\u002Fspan> · 2×3090 <span style=\"color:#2f261a;\">$8.32<\u002Fspan> · mac 512 <span style=\"color:#c23a2e;\">starts past it<\u002Fspan>. u.s. minimum wage: $7.25.<\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div data-screen-label=\"04 Quality\" style=\"border-top:1px solid #c9b78d;\">\n  <div style=\"max-width:1060px; margin:0 auto; padding:84px 40px;\">\n    <div style=\"font-size:13px; color:#6b5b44;\">$ diff <span style=\"color:#b07f1f;\">opus5<\u002Fspan> <span style=\"color:#c23a2e;\">local/*<\u002Fspan> <span style=\"color:#8f7f5f;\"># artificial analysis intelligence index, aug 2026<\u002Fspan><\u002Fdiv>\n    <div style=\"font-size:38px; font-weight:700; color:#2f261a; margin-top:16px; letter-spacing:-1px;\">What quality do you actually get from the box?<\u002Fdiv>\n    <div style=\"font-size:15.5px; color:#3a3022; margin-top:12px; max-width:640px; line-height:1.6;\">The subscription serves a model scoring 63 on the Artificial Analysis index. The open models these desks can hold score 48–56 — and quantizing them to 4-bit so they fit in consumer memory costs roughly 4 more points in every case. Hollow marker: the model at full precision. Filled: as it actually runs in the box.<\u002Fdiv>\n    <div style=\"position:relative; margin-top:46px;\">\n      <div style=\"position:absolute; left:90%; top:-6px; bottom:-6px; width:1px; background:#b07f1f; opacity:0.55;\"><\u002Fdiv>\n      <div style=\"position:absolute; left:90%; top:-26px; transform:translateX(-50%); font-size:11.5px; color:#b07f1f; white-space:nowrap;\">OPUS 5 · 63<\u002Fdiv>\n      <div style=\"display:flex; flex-direction:column; gap:22px;\">\n        <sc-for list=\"{{ quals }}\" as=\"q\" hint-placeholder-count=\"4\">\n          <div style=\"display:grid; grid-template-columns:250px 1fr; gap:16px; align-items:center;\">\n            <div style=\"text-align:right;\"><div style=\"font-size:13.5px; font-weight:600; color:#2f261a;\">{{ q.name }}<\u002Fdiv><div style=\"font-size:11.5px; color:#6b5b44;\">{{ q.sub }}<\u002Fdiv><\u002Fdiv>\n            <div style=\"position:relative; height:22px;\">\n              <div style=\"position:absolute; left:{{ q.lo }}%; right:{{ q.roRight }}%; top:10px; height:2px; background:#8a6a3e;\"><\u002Fdiv>\n              <div style=\"position:absolute; left:{{ q.hi }}%; top:5px; width:12px; height:12px; border-radius:50%; border:2px solid #6b5b44; box-sizing:border-box;\"><\u002Fdiv>\n              <div style=\"position:absolute; left:{{ q.lo }}%; top:5px; width:12px; height:12px; border-radius:50%; background:#c23a2e;\"><\u002Fdiv>\n              <div style=\"position:absolute; left:{{ q.lo }}%; top:-15px; font-size:11.5px; color:#c23a2e;\">{{ q.loV }}<\u002Fdiv>\n              <div style=\"position:absolute; left:{{ q.hi }}%; top:-15px; margin-left:16px; font-size:11.5px; color:#6b5b44;\">{{ q.hiV }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"font-size:11.5px; color:#6b5b44; margin-top:16px;\">scale 45–65 · quantized scores measured in the box; cloud scores vendor-reported<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div data-screen-label=\"05 Fair fight\" style=\"border-top:1px solid #c9b78d;\">\n  <div style=\"max-width:1060px; margin:0 auto; padding:84px 40px;\">\n    <div style=\"font-size:13px; color:#6b5b44;\">$ curl <span style=\"color:#b07f1f;\">market://open-models<\u002Fspan> --price-month 2026-08 <span style=\"color:#8f7f5f;\"># rates checked aug 31, 2026<\u002Fspan><\u002Fdiv>\n    <div style=\"font-size:38px; font-weight:700; color:#2f261a; margin-top:16px; letter-spacing:-1px;\">The fairer comparison: renting the same open models.<\u002Fdiv>\n    <div style=\"font-size:15.5px; color:#3a3022; margin-top:12px; max-width:660px; line-height:1.6;\">Comparing a home rig against a frontier subscription is apples to oranges — the rig runs open models, not Opus. So here is the same 14.69B-token month re-billed at hosted rates for the very models the desks would run:<\u002Fdiv>\n    <div style=\"display:flex; flex-direction:column; gap:13px; margin-top:38px;\">\n      <sc-for list=\"{{ market }}\" as=\"m\" hint-placeholder-count=\"6\">\n        <div style=\"display:grid; grid-template-columns:280px 1fr 110px; gap:16px; align-items:center;\">\n          <div style=\"text-align:right;\"><div style=\"font-size:13px; font-weight:600; color:#2f261a;\">{{ m.name }}<\u002Fdiv><div style=\"font-size:11px; color:#6b5b44;\">{{ m.sub }}<\u002Fdiv><\u002Fdiv>\n          <div style=\"height:16px; background:#d7c69e;\"><div style=\"height:16px; width:{{ m.pct }}%; background:{{ m.color }};\"><\u002Fdiv><\u002Fdiv>\n          <div style=\"font-size:12.5px; color:{{ m.vcolor }};\">{{ m.cost }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"font-size:11.5px; color:#6b5b44; margin-top:16px;\">96% of the workload is re-read memory — the race turns on the cache: first-party hosts re-serve it at 1–3% of list, routed hosts pass through 0.25–0.5× where supported and must be measured per model, and a host with no discount re-bills every re-read in full<\u002Fdiv>\n    <div style=\"font-size:15.5px; color:#3a3022; margin-top:28px; max-width:660px; line-height:1.6;\">Against these bills the desk wins some races: the $2,900 rig repays in <span style=\"color:#b07f1f;\">3–14 months<\u002Fspan> against uncached rates, not 18. But wherever caching passes through, the rental undercuts even free-time ownership — owning only ties when the discount vanishes. Nothing touches the incumbent: <span style=\"color:#2f261a;\">no open model, rented or owned, sells for $200 at frontier quality.<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div data-screen-label=\"06 Five years\" style=\"border-top:1px solid #c9b78d;\">\n  <div style=\"max-width:1060px; margin:0 auto; padding:84px 40px;\">\n    <div style=\"font-size:13px; color:#6b5b44;\">$ gnuplot <span style=\"color:#b07f1f;\">06_five_years.plot<\u002Fspan> <span style=\"color:#8f7f5f;\"># cumulative cash, desk upkeep done on free time — the kindest case<\u002Fspan><\u002Fdiv>\n    <div style=\"font-size:38px; font-weight:700; color:#2f261a; margin-top:16px; letter-spacing:-1px;\">Five-year cost, assuming your time is free.<\u002Fdiv>\n    <svg sc-camel-view-box=\"0 0 1070 560\" style=\"width:100%; margin-top:32px; display:block;\">\n      <line x1=\"90\" y1=\"60\" x2=\"960\" y2=\"60\" stroke=\"#d8c8a2\" stroke-width=\"1\"><\u002Fline>\n      <line x1=\"90\" y1=\"170\" x2=\"960\" y2=\"170\" stroke=\"#d8c8a2\" stroke-width=\"1\"><\u002Fline>\n      <line x1=\"90\" y1=\"280\" x2=\"960\" y2=\"280\" stroke=\"#d8c8a2\" stroke-width=\"1\"><\u002Fline>\n      <line x1=\"90\" y1=\"390\" x2=\"960\" y2=\"390\" stroke=\"#d8c8a2\" stroke-width=\"1\"><\u002Fline>\n      <line x1=\"90\" y1=\"500\" x2=\"960\" y2=\"500\" stroke=\"#8a6a3e\" stroke-width=\"1\"><\u002Fline>\n      <text x=\"80\" y=\"64\" text-anchor=\"end\" font-size=\"12\" fill=\"#6b5b44\" font-family=\"Spline Sans Mono\">$24k<\u002Ftext>\n      <text x=\"80\" y=\"174\" text-anchor=\"end\" font-size=\"12\" fill=\"#6b5b44\" font-family=\"Spline Sans Mono\">$18k<\u002Ftext>\n      <text x=\"80\" y=\"284\" text-anchor=\"end\" font-size=\"12\" fill=\"#6b5b44\" font-family=\"Spline Sans Mono\">$12k<\u002Ftext>\n      <text x=\"80\" y=\"394\" text-anchor=\"end\" font-size=\"12\" fill=\"#6b5b44\" font-family=\"Spline Sans Mono\">$6k<\u002Ftext>\n      <line x1=\"612\" y1=\"60\" x2=\"612\" y2=\"500\" stroke=\"#8a6a3e\" stroke-width=\"1\" stroke-dasharray=\"5 4\"><\u002Fline>\n      <text x=\"612\" y=\"46\" text-anchor=\"middle\" font-size=\"12\" fill=\"#6b5b44\" font-family=\"Spline Sans Mono\">month 36: sold &amp; replaced<\u002Ftext>\n      <line x1=\"90\" y1=\"500\" x2=\"112\" y2=\"60\" stroke=\"#8f7f5f\" stroke-width=\"1.2\" stroke-dasharray=\"3 3\"><\u002Fline>\n      <text x=\"122\" y=\"70\" font-size=\"12\" fill=\"#6b5b44\" font-family=\"Spline Sans Mono\">metered api: gone in week 7<\u002Ftext>\n      <line x1=\"90\" y1=\"447\" x2=\"352\" y2=\"60\" stroke=\"#c23a2e\" stroke-width=\"1.6\"><\u002Fline>\n      <text x=\"360\" y=\"130\" font-size=\"12\" fill=\"#c23a2e\" font-weight=\"600\" font-family=\"Spline Sans Mono\">any desk at $75/h: off the chart in month 19<\u002Ftext>\n      <line x1=\"90\" y1=\"500\" x2=\"960\" y2=\"280\" stroke=\"#b07f1f\" stroke-width=\"2.4\"><\u002Fline>\n      <line x1=\"90\" y1=\"447\" x2=\"960\" y2=\"352.5\" stroke=\"#33604a\" stroke-width=\"1.4\"><\u002Fline>\n      <line x1=\"90\" y1=\"433\" x2=\"960\" y2=\"334\" stroke=\"#33604a\" stroke-width=\"1.4\"><\u002Fline>\n      <line x1=\"90\" y1=\"414\" x2=\"960\" y2=\"282.5\" stroke=\"#33604a\" stroke-width=\"1.4\"><\u002Fline>\n      <line x1=\"90\" y1=\"344\" x2=\"960\" y2=\"203\" stroke=\"#33604a\" stroke-width=\"1.4\"><\u002Fline>\n      <line x1=\"90\" y1=\"302\" x2=\"960\" y2=\"89.5\" stroke=\"#33604a\" stroke-width=\"1.4\"><\u002Fline>\n      <line x1=\"90\" y1=\"185\" x2=\"425\" y2=\"60\" stroke=\"#33604a\" stroke-width=\"1.4\"><\u002Fline>\n      <text x=\"432\" y=\"58\" font-size=\"12\" fill=\"#6b5b44\" font-family=\"Spline Sans Mono\">mac 512: $35k by year 5 →<\u002Ftext>\n      <text x=\"966\" y=\"88\" font-size=\"12\" fill=\"#3a3022\" font-family=\"Spline Sans Mono\">mac 256<\u002Ftext>\n      <text x=\"966\" y=\"207\" font-size=\"12\" fill=\"#3a3022\" font-family=\"Spline Sans Mono\">5090<\u002Ftext>\n      <text x=\"966\" y=\"278\" font-size=\"12\" fill=\"#b07f1f\" font-weight=\"600\" font-family=\"Spline Sans Mono\">plan<\u002Ftext>\n      <text x=\"966\" y=\"300\" font-size=\"12\" fill=\"#3a3022\" font-family=\"Spline Sans Mono\">dgx<\u002Ftext>\n      <text x=\"966\" y=\"338\" font-size=\"12\" fill=\"#3a3022\" font-family=\"Spline Sans Mono\">strix<\u002Ftext>\n      <text x=\"966\" y=\"360\" font-size=\"12\" fill=\"#3a3022\" font-family=\"Spline Sans Mono\">3090<\u002Ftext>\n      <circle cx=\"351\" cy=\"434\" r=\"5\" fill=\"#b07f1f\"><\u002Fcircle>\n      <circle cx=\"380\" cy=\"425\" r=\"5\" fill=\"#b07f1f\"><\u002Fcircle>\n      <circle cx=\"481\" cy=\"399\" r=\"5\" fill=\"#b07f1f\"><\u002Fcircle>\n      <circle cx=\"786\" cy=\"228\" r=\"5\" fill=\"#c23a2e\"><\u002Fcircle>\n      <text x=\"351\" y=\"456\" text-anchor=\"middle\" font-size=\"12\" fill=\"#b07f1f\" font-family=\"Spline Sans Mono\">mo 18<\u002Ftext>\n      <text x=\"392\" y=\"415\" font-size=\"12\" fill=\"#b07f1f\" font-family=\"Spline Sans Mono\">mo 20<\u002Ftext>\n      <text x=\"481\" y=\"421\" text-anchor=\"middle\" font-size=\"12\" fill=\"#b07f1f\" font-family=\"Spline Sans Mono\">mo 27<\u002Ftext>\n      <text x=\"786\" y=\"250\" text-anchor=\"middle\" font-size=\"12\" fill=\"#c23a2e\" font-family=\"Spline Sans Mono\">mo 48 — after it’s sold<\u002Ftext>\n      <text x=\"235\" y=\"524\" text-anchor=\"middle\" font-size=\"12\" fill=\"#6b5b44\" font-family=\"Spline Sans Mono\">year 1<\u002Ftext>\n      <text x=\"380\" y=\"524\" text-anchor=\"middle\" font-size=\"12\" fill=\"#6b5b44\" font-family=\"Spline Sans Mono\">2<\u002Ftext>\n      <text x=\"525\" y=\"524\" text-anchor=\"middle\" font-size=\"12\" fill=\"#6b5b44\" font-family=\"Spline Sans Mono\">3<\u002Ftext>\n      <text x=\"670\" y=\"524\" text-anchor=\"middle\" font-size=\"12\" fill=\"#6b5b44\" font-family=\"Spline Sans Mono\">4<\u002Ftext>\n      <text x=\"815\" y=\"524\" text-anchor=\"middle\" font-size=\"12\" fill=\"#6b5b44\" font-family=\"Spline Sans Mono\">year 5<\u002Ftext>\n    <\u002Fsvg>\n    <div style=\"font-size:12px; color:#6b5b44; margin-top:16px;\">mac 256 crosses at month 63, mac 512 at month 103 — both past the machine’s own replacement. electricity and resale move any line by &lt;$80/mo; the wage moves it by thousands.<\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div data-screen-label=\"07 Prints\" style=\"border-top:1px solid #c9b78d;\">\n  <div style=\"max-width:1360px; margin:0 auto; padding:84px 40px;\">\n    <div style=\"font-size:13px; color:#6b5b44;\">$ open <span style=\"color:#b07f1f;\">prints/<\u002Fspan> <span style=\"color:#8f7f5f;\"># the same month, made for the wall<\u002Fspan><\u002Fdiv>\n    <div style=\"font-size:38px; font-weight:700; color:#2f261a; margin-top:16px; letter-spacing:-1px;\">The same analysis, as prints.<\u002Fdiv>\n    <div style=\"font-size:15.5px; color:#3a3022; margin-top:12px; max-width:640px; line-height:1.6;\">Six hand-drawn plates — chart style after the data portraits of W. E. B. Du Bois and the Atlanta University students (Paris Exposition, 1900). Same data as the sections above; scroll along the wall or open fullscreen.<\u002Fdiv>\n    <div style=\"border:1px solid #8a6a3e; background:#37332d; margin-top:36px;\">\n      <div style=\"padding:12px 16px; border-bottom:1px solid #8a6a3e; display:flex; justify-content:space-between; align-items:center; gap:16px; font-size:11.5px; background:#e2d3ae;\"><span style=\"color:#b07f1f;\">the_metered_month/ · plates 0–5<\u002Fspan><span style=\"display:flex; align-items:center; gap:16px;\"><span style=\"color:#8f7f5f;\">after w. e. b. du bois, 1900 · scroll →<\u002Fspan><button sc-camel-on-click=\"{{ openFull }}\" style=\"background:transparent; color:#b07f1f; border:1px solid #8a6a3e; font-family:'Spline Sans Mono',monospace; font-size:11px; font-weight:600; letter-spacing:1px; padding:5px 12px; cursor:pointer;\" style-hover=\"background:#2f261a; color:#e9dcc0; border-color:#2f261a;\">⛶ FULLSCREEN<\u002Fbutton><\u002Fspan><\u002Fdiv>\n      <div style=\"height:680px; overflow-x:auto; overflow-y:hidden;\">\n        <div style=\"width:6720px; zoom:0.455;\">\n          <dc-import name=\"The Rented Mind\" hint-size=\"6720px,1450px\"><\u002Fdc-import>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ fullOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed; inset:0; z-index:100; background:#37332d; display:flex; flex-direction:column;\">\n      <div style=\"display:flex; justify-content:space-between; align-items:center; padding:12px 24px; background:#2a2620; border-bottom:1px solid #8a6a3e;\">\n        <div style=\"font-size:12.5px; color:#d8c49a;\">the_metered_month/ · plates 0–5 · <span style=\"color:#8f7f5f;\">scroll → · esc to close<\u002Fspan><\u002Fdiv>\n        <button sc-camel-on-click=\"{{ closeFull }}\" style=\"background:transparent; color:#d8c49a; border:1px solid #8a6a3e; font-family:'Spline Sans Mono',monospace; font-size:12px; font-weight:600; letter-spacing:1px; padding:6px 14px; cursor:pointer;\" style-hover=\"background:#c23a2e; color:#e9dcc0; border-color:#c23a2e;\">× CLOSE<\u002Fbutton>\n      <\u002Fdiv>\n      <div data-full-frame=\"\" style=\"flex:1; overflow:auto; min-height:0;\">\n        <div style=\"width:6720px; zoom:{{ fullZoom }};\">\n          <dc-import name=\"The Rented Mind\" hint-size=\"6720px,1450px\"><\u002Fdc-import>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <div style=\"border-top:1px solid #c9b78d;\">\n  <div style=\"max-width:760px; margin:0 auto; padding:84px 40px 110px;\">\n    <div style=\"font-size:13px; color:#6b5b44;\">$ cat signal.log <span style=\"color:#8f7f5f;\"># what the meter is thinking about<\u002Fspan><\u002Fdiv>\n    <div style=\"border-left:2px solid #b07f1f; padding-left:22px; margin-top:28px;\">\n      <div style=\"font-size:22px; font-weight:600; color:#2f261a; line-height:1.45;\">The conclusion: hardware was never the expensive part. The real cost of local AI for this workload is 13.7 hours a month of human attention — everything else is small change against a $200 subscription selling tokens at 74× below list price.<\u002Fdiv>\n      <div style=\"font-size:14px; color:#3a3022; margin-top:16px; line-height:1.65;\">Running local still makes sense when a constraint forces it — data that can’t leave the building, workloads a subscription won’t cover, or hobby time you genuinely price at zero. Otherwise, the hours are the bill.<\u002Fdiv>\n      <div style=\"font-size:12px; color:#8f7f5f; margin-top:16px;\">Aug 31, 2026<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"font-size:11.5px; color:#8f7f5f; margin-top:56px; line-height:2;\">MEASURED JULY 29 – AUGUST 28, 2026 · SOURCE: COSTCALCAI TCO MODEL · OPEN-MODEL RATES CHECKED AUG 31, 2026<br>$ exit 0<\u002Fdiv>\n    <div style=\"display:flex; justify-content:flex-start; margin-top:40px; font-size:11.5px; color:#8f7f5f;\">© <a href=\"https://studiolo.svetim.fm\" style=\"color:#b07f1f; text-decoration:none;\">studiolo.svetim.fm<\u002Fa><\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;organism&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;CRT&quot;},&quot;scanlines&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;CRT&quot;}}\">\nclass Component extends DCLogic {\n  state = { wage: 0, methOpen: false, a3zoom: 0.52, fullOpen: false, fullZoom: 0.6 };\n  measureFull() {\n    const f = document.querySelector('[data-full-frame]');\n    if (!f || !f.clientHeight) return;\n    const z = Math.round(f.clientHeight / 1450 * 1000) / 1000;\n    if (Math.abs(z - this.state.fullZoom) > 0.005) this.setState({ fullZoom: z });\n  }\n  measureA3() {\n    const f = document.querySelector('[data-a3-frame]');\n    if (!f || !f.clientWidth) return;\n    const z = Math.round(f.clientWidth / 1219 * 1000) / 1000;\n    if (Math.abs(z - this.state.a3zoom) > 0.005) this.setState({ a3zoom: z });\n  }\n  componentDidMount() {\n    this._bindTimer = setInterval(() => { this.bindOrganism(); this.measureA3(); if (this.state.fullOpen) this.measureFull(); }, 800);\n    this.bindOrganism();\n    this.measureA3();\n    this._onResize = () => { this.measureA3(); if (this.state.fullOpen) this.measureFull(); };\n    window.addEventListener('resize', this._onResize);\n    this._onKey = e => { if (e.key === 'Escape' && this.state.fullOpen) this.setState({ fullOpen: false }); };\n    window.addEventListener('keydown', this._onKey);\n  }\n  bindOrganism() {\n    if (!(this.props.organism ?? true)) return;\n    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;\n    const canvas = document.querySelector('[data-organism]');\n    if (!canvas || canvas === this._boundCanvas) return;\n    const hero = canvas.parentElement;\n    if (!hero || hero.offsetWidth < 10 || hero.offsetHeight < 10) return;\n    if (this._raf) cancelAnimationFrame(this._raf);\n    this._boundCanvas = canvas;\n    const W = 480, H = Math.max(60, Math.round(W * hero.offsetHeight / Math.max(1, hero.offsetWidth)));\n    canvas.width = W; canvas.height = H;\n    const ctx = canvas.getContext('2d');\n    const N = 2600, trail = new Float32Array(W * H);\n    const ag = new Float32Array(N * 3);\n    for (let i = 0; i < N; i++) {\n      const a = Math.random() * Math.PI * 2, r = Math.random() * H * 0.35;\n      ag[i*3] = W*0.5 + Math.cos(a)*r; ag[i*3+1] = H*0.5 + Math.sin(a)*r; ag[i*3+2] = Math.random()*Math.PI*2;\n    }\n    let mouse = null;\n    hero.addEventListener('mousemove', e => {\n      const b = hero.getBoundingClientRect();\n      mouse = [ (e.clientX - b.left) / b.width * W, (e.clientY - b.top) / b.height * H ];\n    });\n    hero.addEventListener('mouseleave', () => { mouse = null; });\n    const img = ctx.createImageData(W, H);\n    const sense = (x, y) => { const xi = (Math.round(x)+W)%W, yi = (Math.round(y)+H)%H; return trail[yi*W+xi]; };\n    const SA = 0.38, SD = 9, ROT = 0.52, STEP = 1.5;\n    const tick = () => {\n      if (!canvas.isConnected) return;\n      for (let i = 0; i < N; i++) {\n        let x = ag[i*3], y = ag[i*3+1], h = ag[i*3+2];\n        const f = sense(x+Math.cos(h)*SD, y+Math.sin(h)*SD);\n        const l = sense(x+Math.cos(h-SA)*SD, y+Math.sin(h-SA)*SD);\n        const r = sense(x+Math.cos(h+SA)*SD, y+Math.sin(h+SA)*SD);\n        if (f < l && f < r) h += (Math.random()-0.5)*2*ROT;\n        else if (l > r) h -= ROT; else if (r > l) h += ROT;\n        if (mouse) { const dx = mouse[0]-x, dy = mouse[1]-y, d = Math.hypot(dx,dy); if (d < 60 && d > 1) h = Math.atan2(-dy,-dx); }\n        x = (x + Math.cos(h)*STEP + W) % W; y = (y + Math.sin(h)*STEP + H) % H;\n        ag[i*3]=x; ag[i*3+1]=y; ag[i*3+2]=h;\n        trail[Math.round(y)*W + Math.round(x)] += 1.4;\n      }\n      for (let j = 0; j < trail.length; j++) trail[j] *= 0.955;\n      const d = img.data;\n      for (let j = 0; j < trail.length; j++) {\n        const v = Math.min(1, trail[j] * 0.28);\n        d[j*4] = 194*v*0.72; d[j*4+1] = 58*v*0.5; d[j*4+2] = 46*v*0.4; d[j*4+3] = v*235;\n      }\n      ctx.putImageData(img, 0, 0);\n      this._raf = requestAnimationFrame(tick);\n    };\n    this._raf = requestAnimationFrame(tick);\n  }\n  componentWillUnmount() { if (this._raf) cancelAnimationFrame(this._raf); if (this._bindTimer) clearInterval(this._bindTimer); if (this._onResize) window.removeEventListener('resize', this._onResize); if (this._onKey) window.removeEventListener('keydown', this._onKey); }\n  go(label) {\n    const el = document.querySelector(`[data-screen-label=\"${label}\"]`);\n    if (!el) return;\n    window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 52, behavior: 'smooth' });\n  }\n  renderVals() {\n    const { wage } = this.state;\n    const P = pts => 'M' + pts.map((p,i)=>(i?'L':'')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');\n    const meanderPaths = (x0, y0, w, pitch, budgets, colors, ops) => {\n      const out = []; let cur = [], curLen = 0, bi = 0, budget = budgets[0];\n      let x = x0, y = y0, dir = 1;\n      cur.push([x, y]);\n      const emit = () => out.push({ d: P(cur), c: colors[bi], o: ops[bi] });\n      const advance = (nx, ny) => {\n        let dl = Math.hypot(nx - x, ny - y);\n        while (dl > 0 && curLen + dl >= budget - 0.001) {\n          const t = (budget - curLen) / dl;\n          const mx = x + (nx - x) * t, my = y + (ny - y) * t;\n          cur.push([mx, my]); emit();\n          bi++; if (bi >= budgets.length) return false;\n          budget = budgets[bi]; curLen = 0; cur = [[mx, my]]; x = mx; y = my;\n          dl = Math.hypot(nx - x, ny - y);\n        }\n        curLen += dl; x = nx; y = ny; cur.push([x, y]);\n        return true;\n      };\n      let alive = true;\n      while (alive) {\n        alive = advance(dir === 1 ? x0 + w : x0, y);\n        if (!alive) break;\n        const R = pitch / 2, cyc = y + R;\n        for (let i = 1; i <= 8 && alive; i++) {\n          const th = -Math.PI/2 + (i/8)*Math.PI;\n          alive = advance(x0 + (dir===1 ? w + R*Math.cos(th) : -R*Math.cos(th)), cyc + R*Math.sin(th));\n        }\n        y = y0 + Math.round((y - y0)/pitch)*pitch; dir = -dir;\n      }\n      return out;\n    };\n    const meander = meanderPaths(20, 34, 1200, 6.6, [10.4, 396, 5120, 141400],\n      ['#2f261a', '#b07f1f', '#c23a2e', '#c8b389'], [1, 1, 1, 1]);\n    const G = '#33604a', GG = 'rgba(51,96,74,0.25)', R = '#c23a2e', RG = 'rgba(194,58,46,0.25)';\n    const pace = [\n      { name:'RTX 5090', sub:'$8,500 \\u00b7 qwen3.8-27b \\u00b7 q48', pct:10, pct2:18, color:G, glow:GG, verdict:'6 days \\u2014 fits, with room', verdict2:'11 days with retries \\u2014 still fits', vcolor:'#3a3022' },\n      { name:'2\\u00d7 RTX 3090', sub:'$2,900 \\u00b7 qwen3.8-27b \\u00b7 q48', pct:23.3, pct2:41.7, color:G, glow:GG, verdict:'14 days \\u2014 fits', verdict2:'25 days with retries \\u2014 barely', vcolor:'#3a3022' },\n      { name:'MAC STUDIO 256', sub:'$10,800 \\u00b7 glm-5.3-flash \\u00b7 q53', pct:48.3, pct2:78.3, color:G, glow:GG, verdict:'29 days \\u2014 barely', verdict2:'47 days with retries \\u2014 no longer fits', vcolor:'#3a3022' },\n      { name:'DGX SPARK 128', sub:'$4,700 \\u00b7 qwen3.8-flash-next \\u00b7 q52', pct:51.7, pct2:86.7, color:R, glow:RG, verdict:'31 days \\u2014 spills', verdict2:'52 days with retries', vcolor:R },\n      { name:'STRIX HALO 128', sub:'$3,650 \\u00b7 qwen3.8-flash-next \\u00b7 q52', pct:88.3, pct2:100, color:R, glow:RG, verdict:'53 days', verdict2:'88 days with retries \\u2192', vcolor:R },\n      { name:'MAC STUDIO 512', sub:'$17,200 \\u00b7 deepseek v4 pro \\u00b7 q56, best here', pct:100, pct2:100, color:R, glow:RG, verdict:'159 days \\u2192', verdict2:'245 days with retries \\u2192', vcolor:R }\n    ];\n    const PLAN = 5.05, SCALE = 20;\n    const rigs = [\n      { name: '2\\u00d7 RTX 3090', sub: '$2,900 \\u00b7 qwen3.8-27b \\u00b7 q48', hw: 2.17, slope: 0.346 },\n      { name: 'DGX SPARK 128', sub: '$4,700 \\u00b7 qwen3.8-flash-next \\u00b7 q52 \\u00b7 \\u26a0 102% of the month', hw: 3.08, slope: 0.351 },\n      { name: 'RTX 5090', sub: '$8,500 \\u00b7 qwen3.8-27b \\u00b7 q48', hw: 3.23, slope: 0.346 },\n      { name: 'STRIX HALO 128', sub: '$3,650 \\u00b7 qwen3.8-flash-next \\u00b7 q52 \\u00b7 \\u26a0 175% of the month', hw: 4.03, slope: 0.607 },\n      { name: 'MAC STUDIO 256', sub: '$10,800 \\u00b7 glm-5.3-flash \\u00b7 q53', hw: 4.87, slope: 0.346 },\n      { name: 'MAC STUDIO 512', sub: '$17,200 \\u00b7 deepseek v4 pro \\u00b7 q56 \\u00b7 \\u26a0 530% of the month', hw: 39.63, slope: 1.834 }\n    ];\n    const rows = rigs.map(r => {\n      const cost = r.hw + r.slope * wage;\n      const hwPct = Math.min(r.hw / SCALE, 1) * 100;\n      return {\n        name: r.name, sub: r.sub, hwPct,\n        laborPct: Math.max(0, Math.min(cost / SC
